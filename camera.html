<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caméra Téléphone • Streaming</title>
  <!-- Bootstrap 5 + icônes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 12px;
      margin: 0;
    }
    .card-cam {
      background: rgba(20, 25, 40, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 24px 20px 28px;
      width: 100%;
      max-width: 460px;
      transition: transform 0.2s;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 8px 14px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a0b4d0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6c757d;
      display: inline-block;
    }
    .status-badge.active .dot {
      background: #00e676;
      box-shadow: 0 0 12px #00e676aa;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .video-wrapper {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: #0b0e14;
      aspect-ratio: 9 / 16;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 15px 25px -8px black;
      margin: 18px 0 16px;
    }
    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0c12;
    }
    .video-overlay {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      border-radius: 50px;
      padding: 6px 12px;
      color: white;
      font-size: 0.7rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-primary-cam {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 60px;
      padding: 14px 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 18px -6px #2563ebcc;
    }
    .btn-primary-cam:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-2px);
      box-shadow: 0 12px 22px -8px #2563ebee;
    }
    .btn-primary-cam:active {
      transform: translateY(0);
    }
    .btn-primary-cam:disabled {
      background: #2a3142;
      box-shadow: none;
      transform: none;
      opacity: 0.6;
    }
    .btn-outline-cam {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: #b8c7e0;
      border-radius: 60px;
      padding: 12px 18px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-outline-cam:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.4);
      color: white;
    }
    .peer-id {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 60px;
      color: #9ab3d1;
      border: 1px solid rgba(255, 255, 255, 0.06);
      word-break: break-all;
    }
    .info-toast {
      background: rgba(10, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e9f5;
    }
  </style>
</head>
<body>
  <div class="card-cam text-white">
    <!-- En-tête -->
    <div class="d-flex align-items-center justify-content-between mb-2">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-camera-video-fill fs-3" style="color: #3b82f6;"></i>
        <h5 class="mb-0 fw-semibold" style="letter-spacing: -0.2px;">Caméra • Téléphone</h5>
      </div>
      <span class="status-badge" id="statusBadge">
        <span class="dot"></span> <span id="statusText">Inactif</span>
      </span>
    </div>

    <!-- Affichage Peer ID -->
    <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
      <i class="bi bi-broadcast text-secondary"></i>
      <span class="peer-id" id="peerIdDisplay">my-phone-cam-12345</span>
      <button class="btn btn-sm btn-outline-cam py-1 px-3" id="copyPeerBtn" title="Copier l'ID" style="font-size:0.7rem;">
        <i class="bi bi-clipboard"></i>
      </button>
    </div>

    <!-- Flux vidéo -->
    <div class="video-wrapper">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-overlay">
        <i class="bi bi-record-circle-fill" style="color: #ff4d4d; font-size: 0.8rem;"></i>
        <span>LIVE</span>
      </div>
    </div>

    <!-- Boutons d'action -->
    <div class="row g-3 mt-1">
      <div class="col-7">
        <button id="startBtn" class="btn btn-primary-cam w-100 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-play-fill fs-5"></i> Démarrer
        </button>
      </div>
      <div class="col-5">
        <button id="stopBtn" class="btn btn-outline-cam w-100 d-flex align-items-center justify-content-center gap-2" disabled>
          <i class="bi bi-stop-fill"></i> Arrêter
        </button>
      </div>
    </div>

    <!-- Zone d'information / appareils connectés -->
    <div class="mt-3 d-flex align-items-center justify-content-between small text-secondary">
      <span><i class="bi bi-phone me-1"></i> <span id="connectionCount">0</span> appareil(s) connecté(s)</span>
      <span id="cameraInfo" class="text-truncate" style="max-width: 140px;">Caméra arrière</span>
    </div>

    <!-- Toast / alerte discrète -->
    <div id="messageBox" class="mt-3 info-toast p-2 px-3 small d-none align-items-center gap-2">
      <i class="bi bi-info-circle-fill" style="color: #3b82f6;"></i>
      <span id="messageText"></span>
    </div>
  </div>

  <script>
    (function() {
      // ---- Configuration PeerJS ----
      const PEER_ID = 'my-phone-cam-12345';
      const peer = new Peer(PEER_ID, {
        debug: 1,
        config: {
          'iceServers': [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      // ---- Éléments DOM ----
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const localVideo = document.getElementById('localVideo');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const connectionCountSpan = document.getElementById('connectionCount');
      const cameraInfoSpan = document.getElementById('cameraInfo');
      const peerIdDisplay = document.getElementById('peerIdDisplay');
      const copyPeerBtn = document.getElementById('copyPeerBtn');
      const messageBox = document.getElementById('messageBox');
      const messageText = document.getElementById('messageText');

      // ---- État ----
      let currentStream = null;
      let activeCalls = new Set();        // suivi des appels en cours
      let connectionCount = 0;
      let isStreaming = false;

      // ---- Affichage du Peer ID ----
      peerIdDisplay.textContent = PEER_ID;

      // ---- Fonctions utilitaires ----
      function showMessage(msg, type = 'info') {
        messageText.textContent = msg;
        messageBox.classList.remove('d-none');
        // Style léger selon le type
        if (type === 'success') {
          messageBox.style.borderLeft = '4px solid #00e676';
        } else if (type === 'error') {
          messageBox.style.borderLeft = '4px solid #ff4d4d';
        } else {
          messageBox.style.borderLeft = '4px solid #3b82f6';
        }
        // Disparition automatique après 4s
        clearTimeout(window._msgTimeout);
        window._msgTimeout = setTimeout(() => {
          messageBox.classList.add('d-none');
        }, 4000);
      }

      function updateConnectionCount() {
        connectionCountSpan.textContent = activeCalls.size;
      }

      function setStatus(active, text = '') {
        if (active) {
          statusBadge.classList.add('active');
          statusText.textContent = text || 'En direct';
        } else {
          statusBadge.classList.remove('active');
          statusText.textContent = text || 'Inactif';
        }
      }

      function stopStream() {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
          currentStream = null;
        }
        localVideo.srcObject = null;
        isStreaming = false;
        setStatus(false, 'Caméra arrêtée');
        startBtn.disabled = false;
        stopBtn.disabled = true;
        cameraInfoSpan.textContent = 'Aucune caméra';
        // Fermer tous les appels en cours
        activeCalls.forEach(call => call.close());
        activeCalls.clear();
        updateConnectionCount();
        showMessage('Caméra arrêtée.', 'info');
      }

      // ---- Gestion des appels PeerJS ----
      peer.on('call', (call) => {
        if (!isStreaming || !currentStream) {
          call.close();
          showMessage('Appel refusé : caméra non démarrée.', 'error');
          return;
        }
        // Répondre avec le flux
        call.answer(currentStream);
        activeCalls.add(call);
        updateConnectionCount();
        showMessage(`Appel entrant accepté (${activeCalls.size} connecté(s)).`, 'success');

        call.on('close', () => {
          activeCalls.delete(call);
          updateConnectionCount();
          showMessage('Un appareil s\'est déconnecté.', 'info');
        });
        call.on('error', (err) => {
          console.warn('Erreur appel:', err);
          activeCalls.delete(call);
          updateConnectionCount();
        });
      });

      peer.on('error', (err) => {
        console.error('PeerJS error:', err);
        showMessage('Erreur de connexion PeerJS: ' + err.message, 'error');
      });

      peer.on('open', (id) => {
        console.log('PeerJS prêt, ID:', id);
        showMessage('Serveur PeerJS connecté. Prêt à diffuser.', 'success');
      });

      // ---- Démarrer la caméra ----
      startBtn.addEventListener('click', async () => {
        if (isStreaming) {
          showMessage('La caméra est déjà active.', 'info');
          return;
        }

        startBtn.disabled = true;
        startBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Activation...';

        try {
          // Tentative avec caméra arrière (environment)
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { exact: "environment" } },
              audio: false
            });
            cameraInfoSpan.textContent = 'Caméra arrière';
          } catch (e) {
            // Fallback: caméra avant ou n'importe laquelle
            console.warn('Caméra arrière non disponible, utilisation par défaut.');
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
            cameraInfoSpan.textContent = 'Caméra (par défaut)';
          }

          currentStream = stream;
          localVideo.srcObject = stream;
          isStreaming = true;
          setStatus(true, 'En direct');
          stopBtn.disabled = false;
          startBtn.innerHTML = '<i class="bi bi-play-fill fs-5"></i> Démarrer';
          startBtn.disabled = true; // reste désactivé tant que ça tourne
          showMessage('Caméra activée ! En attente de connexion...', 'success');

          // Mettre à jour le nombre de connexions (déjà 0)
          updateConnectionCount();

        } catch (err) {
          console.error('Erreur getUserMedia:', err);
          let userMsg = "Impossible d'accéder à la caméra. ";
          if (err.name === 'NotAllowedError') userMsg += "Autorisation refusée.";
          else if (err.name === 'NotFoundError') userMsg += "Aucune caméra trouvée.";
          else userMsg += err.message;
          showMessage(userMsg, 'error');
          startBtn.disabled = false;
          startBtn.innerHTML = '<i class="bi bi-play-fill fs-5"></i> Démarrer';
          setStatus(false, 'Erreur');
        }
      });

      // ---- Arrêter la caméra ----
      stopBtn.addEventListener('click', () => {
        if (currentStream) {
          stopStream();
        } else {
          showMessage('Aucun flux actif.', 'info');
        }
      });

      // ---- Copier l'ID Peer ----
      copyPeerBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(PEER_ID).then(() => {
          showMessage('ID copié dans le presse-papier !', 'success');
        }).catch(() => {
          showMessage('Impossible de copier l\'ID.', 'error');
        });
      });

      // ---- Nettoyage avant fermeture ----
      window.addEventListener('beforeunload', () => {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        activeCalls.forEach(call => call.close());
        peer.destroy();
      });

      // Initialisation de l'interface
      setStatus(false, 'Inactif');
      stopBtn.disabled = true;
      updateConnectionCount();
      cameraInfoSpan.textContent = 'Caméra non initialisée';
    })();
  </script>
</body>
</html>
